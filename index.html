<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vogue Line</title>
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet" />
  <link rel="stylesheet" href="font.css" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main class="relative">
    <section class="page1 w-full h-screen pt-[.1px] bg-[url('assets/images/hero.jpg')] bg-cover bg-center">
      <nav
        class="flex justify-between items-center px-4 py-2 md:p-4 m-2 md:m-4 uppercase bg-white/30 backdrop-blur-md rounded-md">
        <div class="nav-left">
          <ul class="flex gap-4 lg:gap-8 text-base font-medium">
            <li class="hidden md:block">
              <a class="text-black" href="#women">Women</a>
            </li>
            <li class="hidden md:block">
              <a class="text-black" href="#men">Men</a>
            </li>
            <li class="hidden md:block">
              <a class="text-black" href="#kids">Kids</a>
            </li>
            <li class="md:hidden flex flex-col gap-1 justify-center">
              <span class="block h-px w-4 bg-zinc-800"></span>
              <span class="block h-px w-4 bg-zinc-800"></span>
            </li>
          </ul>
        </div>

        <div class="nav-center absolute left-1/2 -translate-x-1/2">
          <h2>
            <a class="font-bold text-lg sm:text-2xl tracking-tighter" href="#home">Vogue Line</a>
          </h2>
        </div>

        <div class="nav-right">
          <ul class="flex gap-8 text-base font-medium">
            <li class="hidden lg:block">
              <a class="text-black" href="#home">Home</a>
            </li>
            <li class="hidden lg:block">
              <a class="text-black" href="#about">About</a>
            </li>
            <li class="hidden lg:block">
              <a class="text-black" href="#search">Search</a>
            </li>
            <li class="cart">
              <a class="text-black lg:text-zinc-900 text-sm sm:text-base" href="#cart">Cart
                <span>[<span class="text-zinc-800" id="cart-count">0</span>]</span></a>
            </li>
          </ul>
        </div>
      </nav>

      <div class="hero-content w-full">
        <div class="hero-content-left w-fit mt-20 ml-4 md:ml-20 xl:mt-32 xl:ml-40">
          <h1 class="text-white/15 font-bold text-8xl sm:text-[10rem] lg:text-[13rem] leading-none flex flex-col"
            style="-webkit-text-stroke: 2px #ffffffe6;">
            <span>Vogue</span>
            <span>Line</span>
          </h1>
        </div>

      </div>
    </section>

    <section class="page2 w-full min-h-screen">
      <div class="container mx-auto">
        <div class="flex flex-wrap gap-3">
          <div class="product-card relative group w-72 p-2 h-[28rem] cursor-grab">
            <div class="absolute top-5 right-5">
              <i class="ri-shopping-cart-line"></i>
            </div>

            <div
              class="w-full h-[85%] rounded-md overflow-hidden cursor-pointer group-hover:bg-gray-200 transition-colors duration-300">
              <img class="w-full h-full object-cover mix-blend-multiply"
                src="https://www.urbanmonkey.com/cdn/shop/files/um-core-ash-mist-hoodie-front_f29f662b-f38a-4233-b9fe-287911308f81.jpg?v=1728973132&width=330"
                alt="">
            </div>

            <div class="w-full h-[15%] pt-2 flex items-center justify-between">
              <div>
                <p class="cursor-pointer uppercase text-xs">Hoodie // Core</p>
                <p class="text-sm font-medium">RS. 2,500</p>
              </div>
              <div class="flex justify-center items-end flex-col">
                <i class="ri-star-s-fill text-xs"></i>
                <p class="text-sm">2.9/340</p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

  </main>
</body>

</html>
